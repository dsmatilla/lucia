<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Explorador Celular</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: una sola columna con la lámina de laboratorio (imagen + juego) */
:root{
  --bg:#edf2f5; --surface:#ffffff; --surface-2:#f5f8fa; --ink:#1c2230; --muted:#586274; --line:#d4dde5;
  --accent:#7246ad; --accent-soft:#efe7fa; --coral:#cf5236; --coral-soft:#fbe9e3;
  --good:#23794b; --good-soft:#e2f3e9; --bad:#b93a29; --bad-soft:#fbe6e2;
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f141b; --surface:#171e28; --surface-2:#1d2531; --ink:#e7ecf3; --muted:#9ba6b7; --line:#2b3544;
  --accent:#b996ec; --accent-soft:#2b2240; --coral:#f08566; --coral-soft:#3a221c;
  --good:#5fc68f; --good-soft:#173226; --bad:#f07563; --bad-soft:#3a1d19; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171e28; --surface-2:#1d2531; --ink:#e7ecf3; --muted:#9ba6b7; --line:#2b3544;
  --accent:#b996ec; --accent-soft:#2b2240; --coral:#f08566; --coral-soft:#3a221c;
  --good:#5fc68f; --good-soft:#173226; --bad:#f07563; --bad-soft:#3a1d19; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
.wrap{max-width:1000px;margin:0 auto;display:grid;gap:20px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,.pin:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 24px}
header h1{font-size:clamp(2rem,5vw,3.2rem);font-weight:800;letter-spacing:-.02em}
header h1 em{font-style:normal;color:var(--accent)}
header p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;flex-wrap:wrap}
.tabs button{border:0;background:transparent;padding:8px 16px;border-radius:999px;font-weight:700;color:var(--muted)}
@media (max-width:560px){.tabs{width:100%;border-radius:14px;flex-wrap:nowrap}.tabs button{flex:1;padding:8px 4px;font-size:.88rem}}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--surface)}

.main{display:grid;gap:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;min-width:0}

/* Lámina */
.stage-panel{padding:16px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.status{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;min-height:48px}
.prompt{font-family:var(--f-display);font-size:clamp(1.25rem,3vw,1.7rem);font-weight:700}
.prompt small{display:block;font-family:var(--f-body);font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.prompt .target{color:var(--accent)}
.meters{display:flex;gap:8px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.85rem}
.meter{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:4px 10px;display:grid;line-height:1.2}
.meter b{font-size:1.1rem}
.meter span{color:var(--muted);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase}

.stage{position:relative;border-radius:14px;overflow:hidden;background:#e9eef1;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.stage img{display:block;width:100%;height:auto;max-width:100%}
.stage.finding{cursor:crosshair}
.pin{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;border:3px solid #fff;background:var(--accent);
  box-shadow:0 0 0 2px rgba(40,20,70,.35),0 2px 6px rgba(0,0,0,.3);padding:0}
.pin::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid #fff;opacity:.0;animation:pulse 2.4s infinite}
.pin.seen{background:#2f8f5b}
.pin.active{background:var(--coral);transform:translate(-50%,-50%) scale(1.25)}
.pin .tag{position:absolute;left:50%;bottom:calc(100% + 6px);transform:translateX(-50%);white-space:nowrap;background:rgba(24,22,36,.86);color:#fff;
  font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:6px;pointer-events:none;opacity:0;transition:opacity .15s}
.pin:hover .tag,.pin:focus-visible .tag,.stage.labels .pin .tag,.pin.active .tag{opacity:1}
@keyframes pulse{0%{transform:scale(.7);opacity:.8}70%{transform:scale(1.4);opacity:0}100%{opacity:0}}
.stage canvas.region{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;image-rendering:auto;filter:blur(1.5px);mix-blend-mode:multiply;animation:fadein .3s ease-out}
@keyframes fadein{from{opacity:0}}
.mark{position:absolute;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none}
.mark.ok{border:4px solid #2fbf6b;box-shadow:0 0 0 3px rgba(255,255,255,.8);animation:pop .35s ease-out}
.mark.no{width:26px;height:26px;display:grid;place-items:center;color:#fff;background:#d6412e;font-weight:800;font-size:15px;box-shadow:0 0 0 3px #fff;animation:pop .25s ease-out}
.mark.show{border:4px dashed #2fbf6b;box-shadow:0 0 0 3px rgba(255,255,255,.85)}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.3);opacity:0}}
@media (prefers-reduced-motion:reduce){.pin::after,.mark,.stage canvas.region{animation:none!important}}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 14px;font-weight:700}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.hint{background:var(--coral-soft);border-color:transparent;color:var(--coral)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.feedback{border-radius:12px;padding:12px 14px;background:var(--surface-2);border:1px solid var(--line);min-height:52px}
.feedback.ok{background:var(--good-soft);border-color:transparent;color:var(--good)}
.feedback.no{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.feedback b{color:inherit}

/* Ficha de explorar */
.card{display:grid;gap:8px;padding:16px;border-radius:14px;background:var(--accent-soft)}
.card h3{font-size:1.5rem;color:var(--accent)}
.card p{margin:0;max-width:65ch}
.card ul{margin:0;padding-left:20px}
.card .note{font-size:.88rem;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.88rem;font-weight:700}
.chip.seen{border-color:var(--good);color:var(--good)}
.chip.active{background:var(--accent);border-color:var(--accent);color:var(--surface)}

/* Quiz */
.quiz{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.quiz .q{font-family:var(--f-display);font-size:clamp(1.2rem,2.6vw,1.55rem);font-weight:700;max-width:40ch}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.opts{grid-template-columns:minmax(0,1fr)}}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface-2);border-radius:12px;padding:12px 14px;font-weight:700;min-width:0}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.opt[disabled]{cursor:default}
.quiz-thumb{max-width:340px;border-radius:12px;opacity:.95}

.end{display:grid;gap:12px;padding:20px;border-radius:14px;background:var(--accent-soft);text-align:left}
.end .big{font-family:var(--f-mono);font-size:2.6rem;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.end p{margin:0}

/* Pie común de lucia.srz.es */
.pie{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;
  border-top:1px solid var(--line);padding-top:14px;font-size:.9rem;color:var(--muted)}
.pie a{color:inherit;font-weight:700;text-decoration:none}
.pie a:hover{text-decoration:underline}
</style>
</head>

<body>

<div class="wrap">
  <header>
    <div>
      <h1>Explorador <em>Celular</em></h1>
      <p>Aprende las partes de la célula eucariota animal: explórala, encuentra cada orgánulo en la imagen y repasa sus funciones.</p>
    </div>
    <nav class="tabs" role="tablist" aria-label="Modo de juego">
      <button role="tab" id="tab-explorar" data-mode="explorar" aria-selected="true">1 · Explorar</button>
      <button role="tab" id="tab-encontrar" data-mode="encontrar" aria-selected="false">2 · Encontrar</button>
      <button role="tab" id="tab-funciones" data-mode="funciones" aria-selected="false">3 · Funciones</button>
    </nav>
  </header>

  <div class="main">
    <section class="panel stage-panel" id="game" aria-live="polite"></section>
  </div>

  <footer class="pie">
    <a href="./">← Biología y Geología</a>
    <span>lucia.srz.es</span>
  </footer>
</div>

   look:"el líquido azul claro transparente donde flotan todos los orgánulos", pin:[612,405], spots:[[660,415,40],[395,400,34],[300,330,26]]},
  {id:"nucleo", name:"Núcleo", fn:"Protege el ADN.", sub:["Membrana nuclear","Nucleoplasma","Nucleolo","Poros"],

   look:"la bolita morada oscura en el centro del corte del núcleo", spots:[[600,190,22]]},
  {id:"poros", name:"Poros nucleares", parent:"Núcleo", fn:"Son los agujeros de la membrana nuclear por los que pasan sustancias entre el núcleo y el citoplasma.",
   look:"los puntitos de la superficie exterior de la esfera morada", spots:[[668,150,22],[690,205,18]]},
  {id:"rer", name:"Retículo endoplasmático rugoso", fn:"Es rugoso porque tiene ribosomas pegados. (El liso es igual pero sin ribosomas pegados.)",

function meters(list){ return el("div",{class:"meters"}, list.map(([v,l])=>el("div",{class:"meter"},el("b",{},String(v)),el("span",{},l)))); }

// ---------- Modo 1: Explorar ----------
function renderExplorar(){
  state = {mode:"explorar", active: state.active && byId[state.active] ? state.active : "nucleo", labels: !!state.labels};
  game.replaceChildren();
  const st = stage(); if(state.labels) st.classList.add("labels");
  if(BITS[state.active]) paintRegion(st,state.active,"rgba(114,70,173,.38)");
  for(const p of PARTS){
    const [x,y] = p.pin || p.spots[0];
    const pin = el("button",{class:"pin"+(seen.has(p.id)?" seen":"")+(state.active===p.id?" active":""),"aria-label":p.name,onclick:()=>{state.active=p.id;seen.add(p.id);save("cel-seen",[...seen]);renderExplorar();}}, el("span",{class:"tag"},p.name));
    Object.assign(pin.style,pct(x,y)); st.append(pin);
  }
  const p = byId[state.active];
  seen.add(p.id); save("cel-seen",[...seen]);
  const card = el("div",{class:"card"},
    el("h3",{},p.name),
    p.parent ? el("p",{class:"note"},"Parte del "+p.parent.toLowerCase()) : null,
    el("p",{},p.fn),
    p.sub ? el("div",{},el("p",{},el("b",{},"Partes del núcleo:")),el("ul",{},p.sub.map(s=>el("li",{},s)))) : null,
    p.id==="rer" ? el("p",{class:"note"},"Retículo endoplasmático: rugoso = con ribosomas pegados · liso = sin ribosomas pegados.") : null,
    p.id==="centriolos" ? el("p",{class:"note"},"2 centriolos = 1 centrosoma.") : null,
    el("p",{class:"note"},"En la imagen: "+p.look+".")
  );
  game.append(
    el("div",{class:"status"},
      el("div",{class:"prompt"},el("small",{},"Modo explorar"),"Toca los puntos de la célula"),
      meters([[seen.size+"/"+PARTS.length,"vistas"]])),
    st,
    el("div",{class:"toolbar"},
      el("button",{class:"btn",id:"toggle-labels",onclick:()=>{state.labels=!state.labels;renderExplorar();}}, state.labels?"Ocultar nombres":"Mostrar todos los nombres"),
      el("button",{class:"btn primary",onclick:()=>switchMode("encontrar")},"¡Ya me lo sé! Jugar →")),
    card,
    el("div",{class:"chips"}, PARTS.map(q=>el("button",{class:"chip"+(seen.has(q.id)?" seen":"")+(q.id===p.id?" active":""),onclick:()=>{state.active=q.id;renderExplorar();}},q.name)))

const BITS = {}; const AREA = {};
for(const [k,b64] of Object.entries(MASKS.masks)){ const bin=atob(b64); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); BITS[k]=u; let n=0; for(const v of u){ let x=v; while(x){ n+=x&1; x>>=1; } } AREA[k]=n; }
function cellOn(k,gx,gy){ if(gx<0||gy<0||gx>=MASKS.w||gy>=MASKS.h) return false; const i=gy*MASKS.w+gx; return (BITS[k][i>>3]>>(7-(i&7)))&1; }
function inRegion(k,x,y,tol=0){
  const gx=Math.floor(x/MASKS.cell), gy=Math.floor(y/MASKS.cell);
  for(let dy=-tol;dy<=tol;dy++) for(let dx=-tol;dx<=tol;dx++){ if(dx*dx+dy*dy<=tol*tol && cellOn(k,gx+dx,gy+dy)) return true; }
  return false;
}
function hitTest(x,y){
  // la parte más concreta (zona más pequeña) que hay bajo el dedo
  let best=null;
  for(const p of PARTS){ if(BITS[p.id] && inRegion(p.id,x,y) && (!best||AREA[p.id]<AREA[best.id])) best=p; }
  if(best?.id==="poros") return byId["membrana-nuclear"];
  if(best?.id==="ribosomas") return byId["rer"];
  return best;
}
function paintRegion(st,k,color){
  const cv=el("canvas",{class:"region","aria-hidden":"true",width:MASKS.w,height:MASKS.h});
  const ctx=cv.getContext("2d"); ctx.fillStyle=color;
  for(let gy=0;gy<MASKS.h;gy++) for(let gx=0;gx<MASKS.w;gx++) if(cellOn(k,gx,gy)) ctx.fillRect(gx,gy,1,1);
  st.append(cv);
}
function renderEncontrar(){
  game.replaceChildren();
  if(state.done){ return renderEnd("encontrar", state.score, state.order.length*10); }
  const target = byId[state.order[state.i]];
  const st = stage(); st.classList.add("finding");
  st.addEventListener("click", e=>{
    if(state.locked) return;
    const r = st.getBoundingClientRect();
    const x = (e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
    // margen de unos 8 px de pantalla alrededor de la zona (más en pantallas pequeñas)
    const tol = Math.max(1, Math.ceil(8*W/r.width/MASKS.cell));
    if(inRegion(target.id,x,y,tol)){
      const gained = state.tries===0?10:5; state.score+=gained; state.streak++;
      state.marks=[{type:"ok",x,y}]; state.region="ok";
      state.msg={kind:"ok",html:`<b>¡Correcto! +${gained}</b> Toda la zona verde es ${target.name.toLowerCase()}. ${target.fn}`};
      state.locked=true; renderEncontrar();
      setTimeout(nextFind, 2200);
    } else {
      state.tries++; state.streak=0;
      const what = hitTest(x,y);
      state.marks.push({type:"no",x,y});
      if(state.tries>=2){
        state.region="show";
        state.msg={kind:"no",html:`<b>Era la zona verde.</b> ${target.name}: ${target.fn}`};
        state.locked=true; renderEncontrar();
        setTimeout(nextFind, 3000);
      } else {
        state.msg={kind:"no",html: what ? `Has tocado <b>${what.name.toLowerCase()}</b>. ¡Prueba otra vez!` : `Eso está fuera de la célula. ¡Prueba otra vez!`};
        renderEncontrar();
      }
    }
  });
  if(state.region) paintRegion(st,target.id,"rgba(47,191,107,.45)");
  for(const m of state.marks){
    const n=el("div",{class:"mark "+m.type},m.type==="no"?"✕":"");
    Object.assign(n.style,pct(m.x,m.y));
    if(m.type==="ok"){ n.style.width="5%"; n.style.aspectRatio="1"; }
    st.append(n);
  }
  game.append(
    el("div",{class:"status"},
      el("div",{class:"prompt"},el("small",{},`Pregunta ${state.i+1} de ${state.order.length}`),"Toca: ",el("span",{class:"target"},target.name)),
      meters([[state.score,"puntos"],[state.streak,"racha"],[best.encontrar,"récord"]])),
    st,
    (()=>{const f=el("div",{class:"feedback"+(state.msg?" "+state.msg.kind:"")}); f.innerHTML = state.msg?state.msg.html:"Toca en cualquier sitio de la parte que se pide. Acierta a la primera: 10 puntos. A la segunda: 5."; return f;})(),
    el("div",{class:"toolbar"},
      el("button",{class:"btn hint",onclick:()=>askHint()},"💡 Pedir pista"),
      el("button",{class:"btn",onclick:()=>{state.marks=[];nextFind(true);}},"Saltar"),
      el("button",{class:"btn",onclick:newEncontrar},"Empezar de nuevo"))
  );
}
function nextFind(skip){
  state.i++; state.tries=0; state.marks=[]; state.msg=null; state.locked=false; state.region=null;
  if(state.i>=state.order.length){ state.done=true; if(state.score>best.encontrar){best.encontrar=state.score;save("cel-best",best);} }
  renderEncontrar();
}

function renderEnd(kind, score, max){
  const ratio = score/max;
  const msg = ratio>=.9?"¡Eres un experto en la célula!":ratio>=.6?"¡Muy bien! Repasa las que fallaste.":"Vuelve a Explorar y repasa un poco. ¡Tú puedes!";
  game.append(el("div",{class:"end"},
    el("p",{},kind==="encontrar"?"Puntuación final":"Aciertos"),
    el("div",{class:"big"}, kind==="encontrar"?`${score} / ${max}`:`${score} / ${max}`),
    el("p",{},msg),
    el("div",{class:"toolbar"},
      el("button",{class:"btn primary",onclick:kind==="encontrar"?newEncontrar:newFunciones},"Jugar otra vez"),
      el("button",{class:"btn",onclick:()=>switchMode(kind==="encontrar"?"funciones":"encontrar")}, kind==="encontrar"?"Ir a Funciones →":"Ir a Encontrar →"),
      el("button",{class:"btn",onclick:()=>switchMode("explorar")},"Repasar en Explorar"))
  ));
}

function switchMode(m){
  mode=m;
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.mode===m)));
  if(m==="explorar"){state={};renderExplorar();}
  else if(m==="encontrar") newEncontrar();
  else newFunciones();
}
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>switchMode(b.dataset.mode)));

// ---------- Pistas ----------
// Antes las daba el chat. Ahora salen de la descripción que ya trae cada
// parte en PARTS (campo `look`), así que la página funciona sola.
function askHint(){
  if(mode!=="encontrar" || state.done || state.locked) return;
  const t = byId[state.order[state.i]];
  state.msg = {kind:"", html:`<b>Pista.</b> Busca ${t.look}.`};
  renderEncontrar();
}

renderExplorar();
</script>
