<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa de Europa: localiza y aprende</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef2f4;--card:#fff;--tx:#14232e;--mu:#5d6f7b;--sea:#bcd8e6;--land:#dfe8d2;--ln:#8fa57e;--ac:#2f5fd0;--ok:#1c8a5a;--bad:#d2453d;--bd:#cfd9df;--me:#e3ebff}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f171d;--card:#17222a;--tx:#e6edf1;--mu:#92a4b0;--sea:#17384b;--land:#34452f;--ln:#5f7a52;--ac:#7ea2ff;--ok:#4cc58b;--bad:#ff7a70;--bd:#2a3a45;--me:#223566}}
:root[data-theme="dark"]{--bg:#0f171d;--card:#17222a;--tx:#e6edf1;--mu:#92a4b0;--sea:#17384b;--land:#34452f;--ln:#5f7a52;--ac:#7ea2ff;--ok:#4cc58b;--bad:#ff7a70;--bd:#2a3a45;--me:#223566}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Atkinson Hyperlegible',system-ui,sans-serif;min-height:100%;line-height:1.5}
h1,h2,.q,.lb{font-family:'Bricolage Grotesque',system-ui,sans-serif}
.app{max-width:1000px;margin:0 auto;padding:14px;display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px}

/* Cabecera, igual que en las demás páginas */
header h1{font-size:clamp(1.9rem,5vw,2.8rem);font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.1}
header p{margin:4px 0 0;color:var(--mu);max-width:60ch}
.q{font-size:26px;font-weight:800;line-height:1.15;min-height:34px}
.q small{display:block;font-size:13px;font-weight:400;color:var(--mu)}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:9px;padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--ac)}button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.st{font-size:14px;color:var(--mu);min-height:20px;margin-top:6px}
.st.ok{color:var(--ok)}.st.bad{color:var(--bad)}
.mapw{margin-top:10px;border-radius:12px;overflow:hidden;border:1px solid var(--bd)}
svg{display:block;width:100%;height:auto;cursor:crosshair;touch-action:manipulation}
.sea{fill:var(--sea)}.land{fill:var(--land);stroke:var(--ln);stroke-width:1.2;stroke-linejoin:round}
.sl{fill:#8a98a3;font-size:8px;font-style:italic;opacity:.8;text-anchor:middle;pointer-events:none}
.shp{--c:var(--ac);fill:var(--c);fill-opacity:.4;stroke:var(--c);stroke-width:2}
polyline.shp{fill:none;stroke-opacity:.55;stroke-linecap:round;stroke-linejoin:round}
.shp.ok{--c:var(--ok)}.shp.bad{--c:var(--bad)}
.lb{font-size:10px;font-weight:600;fill:var(--tx);stroke:#fff;stroke-width:3;paint-order:stroke;text-anchor:middle;pointer-events:none}

/* Pie común de lucia.srz.es */
.pie{display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;align-items:center;
  border-top:1px solid var(--bd);padding-top:14px;font-size:.9rem;color:var(--mu)}
.pie a{color:inherit;font-weight:700;text-decoration:none}
.pie a:hover{text-decoration:underline}
</style>
</head>

<body>

<header>
<h1>Europa: localiza y sitúa</h1>
<p>Penínsulas, islas, montañas y la Gran Llanura: localízalas en el mapa mudo y repásalas en modo estudio.</p>
</header>
<main class="card">
<div class="q" id="q"></div>
<div class="st" id="st"></div>
<div class="bar" id="cats"></div>
<div class="bar">
<button id="skip">Revelar y seguir</button>
<button id="study">Modo estudio</button>
<button id="rmap">↻ Reiniciar mapa</button>
<span class="st" id="prog" style="margin:0 0 0 auto"></span>
</div>
<div class="mapw"><svg id="map" viewBox="0 0 670 478" role="img" aria-label="Mapa de Europa">
<g id="base"></g><g id="rev"></g><g id="mk"></g></svg></div>
</main>
<footer class="pie">
<a href="./">← Geografía e Historia</a>
<span>lucia.srz.es</span>
</footer>
</div>

const ell=(f,pad=0)=>`<ellipse cx="${f.c[0]}" cy="${f.c[1]}" rx="${f.r[0]+pad}" ry="${f.r[1]+pad}"/>`;
const dist=(p,a,b)=>{const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy||1;let t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/l;t=Math.max(0,Math.min(1,t));return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)};
function hit(f,p){
 if(f.t=='e'){const rx=f.r[0]+f.pad+3,ry=f.r[1]+f.pad+3,dx=p[0]-f.c[0],dy=p[1]-f.c[1];return (dx/rx)**2+(dy/ry)**2<=1}
 if(f.t=='p')return Math.hypot(p[0]-f.c[0],p[1]-f.c[1])<=f.tol;
 for(let i=0;i<f.p.length-1;i++)if(dist(p,f.p[i],f.p[i+1])<=f.tol)return true;return false}
function shape(f,cls){
 if(f.t=='e')return `<g class="shp ${cls}">${ell(f,2)}</g>`;
 if(f.t=='l')return `<polyline class="shp ${cls}" stroke-width="${f.tol*1.5}" points="${P(f.p)}"/>`;
 const [x,y]=f.c;return `<g class="shp ${cls}"><circle cx="${x}" cy="${y}" r="9"/><path d="M${x} ${y-6}L${x+5} ${y+3}H${x-5}Z" fill="var(--c)" fill-opacity=".9"/></g>`}
function label(f){let x,y;if(f.t=='l'){const m=f.p[Math.floor(f.p.length/2)];x=m[0];y=m[1]}else{x=f.c[0];y=f.c[1]}
 if(f.t=='p')y-=14;else if(f.cat==IS||f.t=='e')y+=(f.r?f.r[1]:0)+12;
 return `<text class="lb" x="${x}" y="${y}">${f.n}</text>`}
let cat='Todo',Q=[],i=0,fails=0,good=0,done=0,lock=false,study=false;
const rev=$('#rev'),mk=$('#mk'),st=(t,c='')=>{$('#st').textContent=t;$('#st').className='st '+c};
const cur=()=>Q[i];
function build(){
 $('#cats').innerHTML=['Todo',PE,IS,MO,GL].map(c=>`<button class="${c==cat?'on':''}" data-c="${c}">${c=='Llanura'?'Gran Llanura':c}</button>`).join('');
 $('#cats').querySelectorAll('button').forEach(b=>b.onclick=()=>{cat=b.dataset.c;resetMap()})}
function resetMap(){
 build();study=false;$('#study').classList.remove('on');rev.innerHTML='';mk.innerHTML='';
 Q=F.filter(f=>cat=='Todo'||f.cat==cat).map(f=>[Math.random(),f]).sort((a,b)=>a[0]-b[0]).map(a=>a[1]);
 i=0;fails=0;good=0;done=0;lock=false;show();st('Haz clic en el mapa donde creas que está.')}
function show(){
 const f=cur();$('#prog').textContent=`${done}/${Q.length} · ${good} a la primera`;
 if(!f){$('#q').innerHTML=`¡Terminado!<small>${good} de ${Q.length} a la primera. Reinicia el mapa para repetir.</small>`;return}
 $('#q').innerHTML=`Localiza: ${f.n}<small>${f.cat=='Llanura'?'Relieve':f.cat}</small>`}
function next(){i++;fails=0;done++;lock=false;mk.innerHTML='';show();if(!cur())st('Has completado la ronda.','ok')}
function reveal(f,cls){rev.insertAdjacentHTML('beforeend',shape(f,cls)+label(f))}
svg.addEventListener('click',e=>{
 const f=cur();if(!f||lock||study)return;
 const pt=svg.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;const q=pt.matrixTransform(svg.getScreenCTM().inverse()),p=[q.x,q.y];
 if(hit(f,p)){lock=true;if(!fails)good++;reveal(f,'ok');st(fails?'¡Correcto!':'¡Correcto a la primera!','ok');setTimeout(next,1100)}
 else{fails++;mk.innerHTML=`<circle cx="${p[0]}" cy="${p[1]}" r="9" fill="none" stroke="var(--bad)" stroke-width="3"/>`;
  if(fails>=3){lock=true;reveal(f,'bad');st('Te lo enseño: así se sitúa. Fíjate bien.','bad');setTimeout(next,1800)}
  else st(`No es ahí (${fails}/3). A la tercera te lo enseño.`,'bad')}});
$('#skip').onclick=()=>{const f=cur();if(!f||lock||study)return;lock=true;reveal(f,'bad');st('Revelado. Fíjate dónde está.','bad');setTimeout(next,1600)};
$('#study').onclick=()=>{study=!study;$('#study').classList.toggle('on',study);mk.innerHTML='';
 if(study){const tmp=rev.innerHTML;rev.dataset.keep=tmp;rev.innerHTML=F.map(f=>shape(f,'')+label(f)).join('');st('Modo estudio: todo a la vista. Pulsa de nuevo para volver al juego.')}
 else{rev.innerHTML=rev.dataset.keep||'';st('Vuelves al juego.')}};
$('#rmap').onclick=resetMap;
resetMap();
</script></body></html>
