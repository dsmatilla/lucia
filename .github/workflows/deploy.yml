name: Publicar en lucia.srz.es

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 trae todo el historial, que es de donde build.py saca la
      # fecha de cada página para el índice. Con el checkout normal (solo el
      # último commit) todas saldrían con la misma fecha.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Construir la web
        run: python3 build.py

      - uses: actions/configure-pages@v5

      # Solo se sube dist/, que es lo que genera build.py.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
